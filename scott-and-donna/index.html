<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott &amp; Donna's Fogometer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12001f;
    --pink: #ff2fb4;
    --cyan: #2ff3ff;
    --yellow: #ffe23f;
    --fg: #fdf0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Orbitron', system-ui, sans-serif;
    color: var(--fg);
    background: linear-gradient(#0a0014 0%, #2a0845 45%, #6a0f5b 62%, var(--bg) 62%);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
    position: relative;
  }

  /* Sunset sun with stripes */
  .sun {
    position: fixed;
    left: 50%;
    top: 62vh;
    width: min(95vw, 680px);
    aspect-ratio: 1;
    transform: translate(-50%, -72%);
    border-radius: 50%;
    background: linear-gradient(var(--yellow) 10%, #ff7b3f 45%, var(--pink) 80%);
    -webkit-mask: repeating-linear-gradient(#000 0 14px, transparent 14px 20px) bottom / 100% 45% no-repeat,
                  linear-gradient(#000, #000) top / 100% 55% no-repeat;
            mask: repeating-linear-gradient(#000 0 14px, transparent 14px 20px) bottom / 100% 45% no-repeat,
                  linear-gradient(#000, #000) top / 100% 55% no-repeat;
    filter: drop-shadow(0 0 40px rgba(255, 47, 180, .6));
    opacity: .85;
    pointer-events: none;
  }

  /* Neon perspective grid floor */
  .grid {
    position: fixed;
    left: -50%; right: -50%;
    top: 62vh; bottom: -10vh;
    background:
      linear-gradient(var(--pink) 2px, transparent 2px) 0 0 / 100% 48px,
      linear-gradient(90deg, var(--pink) 2px, transparent 2px) 0 0 / 48px 100%;
    transform: perspective(300px) rotateX(60deg);
    transform-origin: top;
    -webkit-mask: linear-gradient(transparent, #000 30%);
            mask: linear-gradient(transparent, #000 30%);
    animation: drive 1.2s linear infinite;
    opacity: .7;
    pointer-events: none;
  }
  @keyframes drive { to { background-position: 0 48px, 0 0; } }

  /* CRT scanlines */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 5;
  }

  main {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    text-align: center;
    padding: 28px 22px 24px;
    background: rgba(18, 0, 31, .9);
    border: 2px solid var(--cyan);
    border-radius: 6px;
    box-shadow: 0 0 12px var(--cyan), inset 0 0 18px rgba(47, 243, 255, .25);
    backdrop-filter: blur(4px);
  }

  .names {
    font-family: 'VT323', monospace;
    font-size: 22px;
    letter-spacing: .2em;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }
  h1 {
    font-family: 'Monoton', cursive;
    font-weight: 400;
    font-size: clamp(34px, 11vw, 52px);
    line-height: 1.1;
    margin: 6px 0 20px;
    background: linear-gradient(#fff 0%, #ffd6f3 45%, var(--pink) 50%, #ffe23f 100%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 47, 180, .8));
  }

  .gauge { position: relative; }

  /* About to blow: shake, throb, glow */
  .gauge::before {
    content: '';
    position: absolute;
    inset: 10% 5% -5%;
    border-radius: 50%;
    background: radial-gradient(rgba(255, 45, 61, .85), transparent 62%);
    opacity: 0;
    pointer-events: none;
  }
  .gauge.critical { animation: shake .18s linear infinite; }
  .gauge.critical::before { animation: throb .6s ease-in-out infinite; }
  .gauge.critical #fill { animation: swell .6s ease-in-out infinite; }
  .gauge.critical .days { animation: pound .6s ease-in-out infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0) rotate(0); }
    20%  { transform: translate(-2px, 1px) rotate(-.6deg); }
    40%  { transform: translate(2px, -1px) rotate(.6deg); }
    60%  { transform: translate(-1px, -2px) rotate(-.3deg); }
    80%  { transform: translate(1px, 2px) rotate(.4deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  main:has(.gauge.critical) { animation: alarm .6s ease-in-out infinite; }
  @keyframes alarm {
    50% { border-color: #ff2d3d; box-shadow: 0 0 28px #ff2d3d, inset 0 0 30px rgba(255, 45, 61, .35); }
  }
  @keyframes throb { 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes swell { 50% { stroke-width: 17; } }
  @keyframes pound {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.12); color: #ffd0d4; }
    30% { transform: scale(1); }
    45% { transform: scale(1.06); }
  }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  #needle {
    transform-origin: 150px 150px;
    transform: rotate(-90deg);
    transition: transform 1.8s cubic-bezier(.2, .8, .2, 1);
  }
  .readout { position: absolute; left: 0; right: 0; bottom: -4px; }
  .days {
    font-weight: 900;
    font-size: clamp(60px, 20vw, 88px);
    line-height: .9;
    color: var(--fg);
    text-shadow: 0 0 6px var(--pink), 0 0 18px var(--pink), 3px 3px 0 var(--cyan);
    font-variant-numeric: tabular-nums;
  }
  .unit {
    font-family: 'VT323', monospace;
    font-size: 20px;
    letter-spacing: .12em;
    color: var(--cyan);
    margin-top: 6px;
  }

  .status {
    margin-top: 28px;
    font-family: 'VT323', monospace;
    font-size: 26px;
    line-height: 1.15;
    min-height: 2.3em;
    display: grid;
    place-items: center;
    color: var(--yellow);
    text-shadow: 0 0 8px currentColor;
  }
  .status.urgent { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    font-family: 'VT323', monospace;
    font-size: 22px;
    letter-spacing: .04em;
    white-space: nowrap;
    padding: 10px 4px;
    color: var(--fg);
    background: rgba(255, 47, 180, .12);
    border: 2px solid var(--pink);
    border-radius: 4px;
    box-shadow: 0 0 10px rgba(255, 47, 180, .6);
    text-decoration: none;
    cursor: pointer;
    transition: background .2s, box-shadow .2s;
  }
  .btn:hover, .btn.on { background: rgba(255, 47, 180, .35); box-shadow: 0 0 18px var(--pink); }
  .btn.alt { border-color: var(--cyan); background: rgba(47, 243, 255, .1); box-shadow: 0 0 10px rgba(47, 243, 255, .6); }
  .btn.alt:hover { background: rgba(47, 243, 255, .3); box-shadow: 0 0 18px var(--cyan); }

  footer {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px dashed rgba(47, 243, 255, .5);
    display: flex;
    justify-content: space-between;
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--cyan);
  }
  footer span:last-child { color: var(--fg); }

  @media (max-width: 600px) {
    body {
      place-items: start center;
      padding-top: 24vh;
      background: linear-gradient(#0a0014 0, #2a0845 20vh, #6a0f5b 34vh, var(--bg) 34vh);
      background-attachment: fixed;
    }
    .sun, .grid { top: 34vh; }
    .sun { width: 80vw; transform: translate(-50%, -80%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .grid, .status.urgent, .gauge.critical, .gauge.critical::before,
    .gauge.critical #fill, .gauge.critical .days, main { animation: none !important; }
    #needle { transition: none; }
  }
</style>
</head>
<body>
<div class="sun"></div>
<div class="grid"></div>

<main>
  <div class="names">★ SCOTT &amp; DONNA ★</div>
  <h1>Fogometer</h1>

  <div class="gauge">
    <svg viewBox="0 0 300 160" aria-hidden="true">
      <defs>
        <linearGradient id="neon" x1="0" x2="1">
          <stop offset="0" stop-color="#2ff3ff"/>
          <stop offset=".45" stop-color="#b44bff"/>
          <stop offset=".75" stop-color="#ff2fb4"/>
          <stop offset="1" stop-color="#ff2d3d"/>
        </linearGradient>
        <filter id="glow" filterUnits="userSpaceOnUse" x="-30" y="-30" width="360" height="220">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M 20 150 A 130 130 0 0 1 280 150" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12" stroke-linecap="round"/>
      <path id="fill" d="M 20 150 A 130 130 0 0 1 280 150" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" filter="url(#glow)"/>
      <g id="ticks"></g>
      <g id="needle" filter="url(#glow)">
        <line x1="150" y1="52" x2="150" y2="4" stroke="#ffe23f" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="readout">
      <div class="days" id="days">0</div>
      <div class="unit">DAYS SINCE LAST FOGO</div>
    </div>
  </div>

  <p class="status" id="status">LOADING…</p>

  <div class="actions">
    <button class="btn" id="music" type="button">▶ PLAY TAPE</button>
    <a class="btn alt" target="_blank" rel="noopener"
       href="https://www.google.com/maps/dir/?api=1&amp;origin=Goleta%2C+CA&amp;destination=Fogo+de+Ch%C3%A3o+Emeryville%2C+CA&amp;travelmode=driving">🚗 ROAD TRIP</a>
  </div>

  <footer><span>LAST FOGO</span><span id="last">—</span></footer>
</main>

<script>
  // SCOTT & DONNA'S LAST FOGO DATE — set to 'YYYY-MM-DD' after their next visit.
  // null = way too long ago (gauge pegged in the red).
  const LAST_FOGO_DATE = null;
  const FOGO_CYCLE_DAYS = 365; // yearly turnaround

  const STAGES = [
    [1,   '😎 TOTALLY STUFFED. GAG ME WITH A SKEWER.', '#2ff3ff'],
    [60,  '📼 STILL RIDING THAT MEAT HIGH, DUDE',     '#2ff3ff'],
    [120, '🕹️ LIKE, KINDA MISSING THE PICANHA…',      '#7fd8ff'],
    [180, '📻 MEAT CRAVINGS TO THE MAX!',             '#b44bff'],
    [240, '🌴 DREAMING OF ENDLESS MEAT…',             '#e04bff'],
    [300, '⚡ FOGO IS RADICALLY IMMINENT!',            '#ff2fb4'],
    [365, '🚨 WHEN I SAY FOGO, YOU SAY…',             '#ff2fb4'],
    [Infinity, '💀 GAME OVER. INSERT FOGO TO CONTINUE.', '#ff3d3d'],
  ];

  const ticks = document.getElementById('ticks');
  for (let i = 0; i <= 6; i++) { // a tick every ~2 months
    const a = Math.PI * (1 - i / 6);
    const p = r => [150 + Math.cos(a) * r, 150 - Math.sin(a) * r];
    const [x1, y1] = p(114), [x2, y2] = p(104);
    ticks.insertAdjacentHTML('beforeend',
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2ff3ff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>`);
  }

  function update() {
    let days = Infinity, lastText = 'WAY TOO LONG AGO';
    if (LAST_FOGO_DATE) {
      const [y, m, d] = LAST_FOGO_DATE.split('-').map(Number);
      const last = new Date(y, m - 1, d);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      days = Math.max(0, Math.round((today - last) / 864e5));
      lastText = last.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
    }
    const pct = Math.min(days / FOGO_CYCLE_DAYS, 1);

    document.getElementById('days').textContent = days === Infinity ? '???' : days;
    document.getElementById('last').textContent = lastText;
    document.getElementById('fill').setAttribute('stroke-dasharray', `${pct * 100} 100`);
    document.getElementById('needle').style.transform = `rotate(${-90 + pct * 180}deg)`;

    const [, msg, color] = STAGES.find(([max]) => days < max) || STAGES.at(-1);
    const status = document.getElementById('status');
    status.textContent = msg;
    status.style.color = color;
    status.classList.toggle('urgent', days >= 300);
    document.querySelector('.gauge').classList.toggle('critical', days >= 300);
  }

  requestAnimationFrame(update);

  // ---- Original synthwave loop, made live with Web Audio (Am–F–C–G) ----
  const synth = (() => {
    const BPM = 104, S = 60 / BPM / 4;            // one 16th note
    const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
    const ROOTS = [45, 41, 48, 43];
    const hz = m => 440 * 2 ** ((m - 69) / 12);
    let ctx, out, verb, noise, timer, step, next;

    function init() {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.connect(ctx.destination);
      out = ctx.createGain(); out.gain.value = .55; out.connect(comp);
      // Big 80s reverb from a decaying noise impulse
      verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.5, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3;
      }
      verb.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = .35;
      verb.connect(wet).connect(out);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const n = noise.getChannelData(0);
      for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
    }

    function env(t, peak, attack, decay, sustain = 0.0001) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(Math.max(sustain, 0.0001), t + attack + decay);
      return g;
    }

    function tone(type, freq, t, dur, peak, cutoff, send = 0, attack = .005, detune = 0) {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter();
      o.type = type; o.frequency.value = freq; o.detune.value = detune;
      f.type = 'lowpass'; f.frequency.value = cutoff;
      const g = env(t, peak, attack, dur);
      o.connect(f).connect(g).connect(out);
      if (send) { const s = ctx.createGain(); s.gain.value = send; g.connect(s).connect(verb); }
      o.start(t); o.stop(t + attack + dur + .05);
    }

    function hit(t, hp, peak, dur, send = 0) {
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter();
      src.buffer = noise; f.type = 'highpass'; f.frequency.value = hp;
      const g = env(t, peak, .002, dur);
      src.connect(f).connect(g).connect(out);
      if (send) { const s = ctx.createGain(); s.gain.value = send; g.connect(s).connect(verb); }
      src.start(t); src.stop(t + dur + .05);
    }

    function kick(t) {
      const o = ctx.createOscillator(), g = env(t, 1, .002, .35);
      o.frequency.setValueAtTime(130, t);
      o.frequency.exponentialRampToValueAtTime(40, t + .15);
      o.connect(g).connect(out); o.start(t); o.stop(t + .4);
    }

    function play(i, t) {
      const bar = Math.floor(i / 16) % 4, s = i % 16, section = Math.floor(i / 64) % 2;
      // Driving octave bass
      tone('sawtooth', hz(ROOTS[bar] + (s % 2 ? 12 : 0)), t, S * .8, .16, 700);
      // Drums
      if (s % 4 === 0) kick(t);
      if (s === 4 || s === 12) hit(t, 1200, .45, .22, .8);   // gated-reverb snare
      if (s % 2 === 0) hit(t, 7000, .07, .04);               // hi-hat
      // Lush detuned pad
      if (s === 0) for (const m of CHORDS[bar]) for (const d of [-8, 8])
        tone('sawtooth', hz(m), t, 16 * S, .035, 1400, .6, .4, d);
      // Sparkly arpeggio on every other pass
      if (section && s % 2 === 0) {
        const notes = CHORDS[bar], pat = [0, 1, 2, 1, 0, 2, 1, 2];
        tone('square', hz(notes[pat[s / 2]] + 12), t, S * 1.6, .045, 3000, .7);
      }
    }

    function tick() {
      while (next < ctx.currentTime + .12) { play(step++, next); next += S; }
    }

    return {
      get playing() { return !!timer; },
      async start() {
        if (!ctx) init();
        await ctx.resume();
        step = 0; next = ctx.currentTime + .06;
        timer = setInterval(tick, 25); tick();
      },
      stop() { clearInterval(timer); timer = null; ctx.suspend(); },
    };
  })();

  const musicBtn = document.getElementById('music');
  musicBtn.addEventListener('click', async () => {
    if (synth.playing) synth.stop(); else await synth.start();
    musicBtn.textContent = synth.playing ? '❚❚ STOP TAPE' : '▶ PLAY TAPE';
    musicBtn.classList.toggle('on', synth.playing);
  });
  setInterval(update, 60000);
</script>
</body>
</html>
