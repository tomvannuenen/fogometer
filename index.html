<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fogometer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0d;
    --fg: #f4f1ec;
    --muted: #7d7a75;
    --track: #1d1c1f;
    --accent: #ff5a1f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: auto 0 -40vh 0;
    height: 80vh;
    background: radial-gradient(ellipse at center, var(--glow, rgba(255,90,31,.18)), transparent 65%);
    pointer-events: none;
    transition: background 1s;
  }
  main {
    position: relative;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 40px;
  }
  header b { color: var(--fg); font-weight: 700; letter-spacing: .1em; }
  .gauge { position: relative; width: 100%; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .readout {
    position: absolute;
    left: 0; right: 0; bottom: 0;
  }
  .days {
    font-size: clamp(64px, 22vw, 96px);
    font-weight: 700;
    line-height: .9;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .status {
    margin: 40px 0 0;
    font-size: 20px;
    font-weight: 500;
    min-height: 1.4em;
    color: var(--status, var(--fg));
  }
  .status.urgent { animation: pulse .8s ease-in-out infinite; }
  footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--track);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }
  footer span:last-child { color: var(--fg); }
  #needle {
    transform-origin: 150px 150px;
    transform: rotate(-90deg);
    transition: transform 1.6s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) {
    #needle { transition: none; }
    .status.urgent { animation: none; }
  }
</style>
</head>
<body>
<main>
  <header><b>🔥 Fogometer</b><span>Highly scientific</span></header>

  <div class="gauge">
    <svg viewBox="0 0 300 160" aria-hidden="true">
      <defs>
        <linearGradient id="heat" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#3ddc84"/>
          <stop offset=".45" stop-color="#ffc53d"/>
          <stop offset=".75" stop-color="#ff7a1f"/>
          <stop offset="1" stop-color="#ff2d3d"/>
        </linearGradient>
      </defs>
      <path d="M 20 150 A 130 130 0 0 1 280 150" fill="none" stroke="var(--track)" stroke-width="14" stroke-linecap="round"/>
      <path id="fill" d="M 20 150 A 130 130 0 0 1 280 150" fill="none" stroke="url(#heat)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
      <g id="ticks"></g>
      <g id="needle">
        <line x1="150" y1="52" x2="150" y2="6" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="readout">
      <div class="days" id="days">0</div>
      <div class="unit">days since last Fogo</div>
    </div>
  </div>

  <p class="status" id="status">Calculating…</p>

  <footer><span>Last Fogo</span><span id="last">—</span></footer>
</main>

<script>
  // SHARED LAST FOGO DATE — update this after each visit ('YYYY-MM-DD')
  const LAST_FOGO_DATE = '2026-04-26';
  const FOGO_CYCLE_DAYS = 180; // about 6 months

  const STAGES = [
    [1,   '😴 Decompressing from previous Fogo…', '#3ddc84'],
    [30,  '😊 Still satisfied from last Fogo',     '#3ddc84'],
    [60,  '🤔 Starting to miss those meats…',      '#9be05a'],
    [90,  '😋 Meat cravings intensifying!',        '#ffc53d'],
    [120, '🤤 Dreams of endless meat…',            '#ff9f1f'],
    [150, '⚠️ Fogo imminent!',                     '#ff7a1f'],
    [180, '🚨 When I say FOGO, you say…',          '#ff2d3d'],
    [Infinity, '💀 EMERGENCY. MUST. HAVE. FOGO. NOW.', '#ff2d3d'],
  ];

  // Tick marks every 30 days
  const ticks = document.getElementById('ticks');
  for (let d = 0; d <= FOGO_CYCLE_DAYS; d += 30) {
    const a = Math.PI * (1 - d / FOGO_CYCLE_DAYS);
    const x = 150 + Math.cos(a) * 112, y = 150 - Math.sin(a) * 112;
    const x2 = 150 + Math.cos(a) * 104, y2 = 150 - Math.sin(a) * 104;
    ticks.insertAdjacentHTML('beforeend',
      `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#3a383c" stroke-width="2" stroke-linecap="round"/>`);
  }

  function update() {
    const [y, m, d] = LAST_FOGO_DATE.split('-').map(Number);
    const last = new Date(y, m - 1, d);
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.max(0, Math.round((today - last) / 864e5));
    const pct = Math.min(days / FOGO_CYCLE_DAYS, 1);

    document.getElementById('days').textContent = days;
    document.getElementById('last').textContent =
      last.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('fill').setAttribute('stroke-dasharray', `${pct * 100} 100`);
    document.getElementById('needle').style.transform = `rotate(${-90 + pct * 180}deg)`;

    const [, msg, color] = STAGES.find(([max]) => days < max);
    const status = document.getElementById('status');
    status.textContent = msg;
    status.classList.toggle('urgent', days >= 150);
    document.documentElement.style.setProperty('--status', color);
    document.body.style.setProperty('--glow', color + '2e');
  }

  requestAnimationFrame(update);
  setInterval(update, 60000);
</script>
</body>
</html>
